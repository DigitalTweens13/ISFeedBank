name: Render PlantUML Diagrams

on:
  push:
    branches:
      - '**'   # любая ветка

permissions:
  contents: write   # Даем право на push

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Нужно для сравнения с предыдущим коммитом

      - name: Setup Java
        uses: actions/setup-java@v5   # Убираем deprecated-предупреждение
        with:
          distribution: temurin
          java-version: '17'

      # Настраиваем пользователя git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Находим новые/изменённые .puml относительно предыдущего коммита
      - name: Detect changed .puml files
        id: changed
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # Первый пуш в ветку — сравнивать не с чем, берём все .puml
            FILES=$(git ls-files '*.puml')
          else
            FILES=$(git diff --name-only --diff-filter=ACMR \
              ${{ github.event.before }} ${{ github.sha }} -- '*.puml')
          fi

          # Убираем пустые строки и собираем в одну строку через пробел
          FILES=$(echo "$FILES" | tr '\n' ' ' | xargs)

          if [ -z "$FILES" ]; then
            echo "No .puml changes detected."
            echo "files=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed .puml files: $FILES"
            echo "files=$FILES" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # Рендерим только изменённые .puml
      - name: Render changed diagrams
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p rendered
          for f in ${{ steps.changed.outputs.files }}; do
            echo "Rendering $f"
            # -tsvg можно заменить на -tpng, если нужен PNG
            java -jar plantuml.jar -tsvg -o "$(pwd)/rendered" "$f" \
              || { echo "Failed to render $f"; exit 1; }
          done

      # Коммитим только если реально есть изменения
      - name: Commit and Push Rendered Artifacts
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git add rendered
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: render diagrams for ${{ github.sha }}"
          git push
